<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Spanreed</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --fg: #1d1d1b; --muted: #6b6a66; --line: #e2e0da; --accent: #3b5bdb; --err: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1e; --fg: #ecebe7; --muted: #9a9993; --line: #2f2f2d; --accent: #7b93f0; --err: #ff8787; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { color: var(--muted); margin: 8px 0; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .error { color: var(--err); }
  .google { display: block; text-align: center; margin: 20px 0 4px; padding: 12px; border-radius: 8px;
            border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-decoration: none; font-weight: 600; }
  .google:hover { border-color: var(--accent); }
  .or { text-align: center; font-size: 14px; margin: 12px 0; }
</style>
</head>
<body>
<main>
  <h1>Spanreed</h1>
  <!--error-->
  <!--google-->
  <p>Use a login link to log in on a new device.</p>
  <p>Run <b>Web UI login link</b> from the <code>/do</code> menu in Telegram
     (or the Obsidian command palette) and open the link it sends you.</p>
  <p>If no chat surface can reach you, the server admin can run
     <code>python -m spanreed.web.login_link &lt;user id&gt;</code>.</p>
</main>
</body>
</html>
