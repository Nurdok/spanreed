<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanreed</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/icon-192.png">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #3b5bdb; --accent-fg: #fff; --bubble: #ffffff; --mine: #dbe4ff; --notice: #fff4e6;
    --err: #c92a2a; --ok: #2b8a3e;
    --trig: #a8590a; --trig-soft: #fdeed8; --act: #3b5bdb; --act-soft: #e4e9fd;
    --ask: #0b7a5c; --ask-soft: #dcf3ea; --logic: #6a4bb5; --logic-soft: #ece6fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1e; --fg: #ecebe7; --muted: #9a9993; --line: #2f2f2d;
      --accent: #7b93f0; --accent-fg: #10121a; --bubble: #262624; --mine: #2b3561; --notice: #3a2e1d;
      --err: #ff8787; --ok: #69db7c;
      --trig: #f0a94e; --trig-soft: #3a2a14; --act: #8fa4f5; --act-soft: #232b4d;
      --ask: #5fd0aa; --ask-soft: #15332a; --logic: #b6a0f0; --logic-soft: #2b2444;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { color: var(--muted); font-size: 14px; }
  .link { background: none; border: 0; color: var(--accent); padding: 4px; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; background: var(--card); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 4px 8px; }
  #filter { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--bg); color: var(--fg); font: inherit; margin-bottom: 8px; }
  .cmd { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px;
         background: none; color: var(--fg); }
  .cmd:hover, .cmd:focus-visible { background: var(--bg); outline: none; }
  .cmd small { display: block; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--muted); margin: auto; text-align: center; max-width: 360px; }
  .bubble { max-width: min(640px, 92%); padding: 8px 12px; border-radius: 12px; background: var(--bubble);
            border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
  .bubble.mine { background: var(--mine); border-color: transparent; align-self: flex-end; }
  .bubble.notice { background: var(--notice); border-color: transparent; }
  .bubble pre { white-space: pre-wrap; margin: 4px 0; }
  .bubble a { color: var(--accent); }
  .spoiler { background: var(--muted); color: transparent; border-radius: 3px; }
  .spoiler:hover { color: inherit; background: none; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  .sys.err { color: var(--err); }
  #dock { border-top: 1px solid var(--line); background: var(--card); padding: 12px 16px; }
  #dock:empty { display: none; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .status:last-child { margin-bottom: 0; }
  .status span { flex: 1; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1 1 140px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--bg); color: var(--fg); }
  .row button:hover { border-color: var(--accent); }
  form.input { display: flex; gap: 8px; }
  form.input textarea { flex: 1; resize: vertical; min-height: 42px; max-height: 40vh; padding: 9px 10px;
                        border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .primary { padding: 9px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); }
  .conn { color: var(--err); font-size: 13px; }
  #settings { min-height: 0; }
  #settings[hidden], .layout[hidden] { display: none; }
  #settings-main { overflow-y: auto; padding: 16px; }
  #settings-main form { max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
  #settings-main h2 { font-size: 17px; margin: 0; }
  .cmd.current { background: var(--bg); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label, .field > .name { font-weight: 600; font-size: 14px; }
  .field .help { color: var(--muted); font-size: 13px; }
  .field input[type=text], .field input[type=password], .field input[type=number],
  .field select, .field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font: inherit; }
  .field textarea { resize: vertical; min-height: 40px; }
  .field textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .field.check { flex-direction: row; align-items: center; gap: 8px; }
  .field.check > label { font-weight: 600; }
  .group { border: 1px solid var(--line); border-radius: 10px; padding: 12px;
           display: flex; flex-direction: column; gap: 12px; }
  .fields { display: flex; flex-direction: column; gap: 12px; }
  .item-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .item-head span { flex: 1; }
  .small { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--bg); color: var(--fg); font-size: 13px; align-self: flex-start; }
  .small:hover { border-color: var(--accent); }
  .small:disabled { opacity: .4; cursor: default; }
  .save-row { display: flex; align-items: center; gap: 12px; position: sticky; bottom: 0;
              background: var(--bg); padding: 10px 0; }
  .save-row .ok { color: var(--muted); }
  .save-row .err { color: var(--err); }
  /* Workflows: a list on the left, one workflow's steps and runs beside it. */
  #workflow-main { overflow-y: auto; padding: 16px; min-width: 0; min-height: 0;
                   display: flex; flex-direction: column; gap: 14px; }
  .k-trigger { --k: var(--trig); --ks: var(--trig-soft); }
  .k-action { --k: var(--act); --ks: var(--act-soft); }
  .k-ask { --k: var(--ask); --ks: var(--ask-soft); }
  .k-logic { --k: var(--logic); --ks: var(--logic-soft); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--line); }
  .dot.bad { background: var(--err); }
  .glyph { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; flex: none;
           background: var(--ks); color: var(--k); font-size: 11.5px; font-weight: 700; }
  .glyph.sm { width: 20px; height: 20px; border-radius: 6px; font-size: 9.5px; }
  .cmd.wf { display: flex; flex-direction: column; gap: 5px; }
  .cmd.wf .wf-name { display: flex; align-items: baseline; gap: 8px; }
  .cmd.wf .wf-name .dot { position: relative; top: -1px; }
  .cmd.wf .chain { display: flex; gap: 3px; }
  .cmd.wf small { font-weight: 400; }
  .wf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .wf-head h2 { font-size: 17px; margin: 0 auto 0 0; min-width: 0; overflow-wrap: anywhere; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .switch input { appearance: none; -webkit-appearance: none; width: 36px; height: 20px; margin: 0; flex: none;
                  border-radius: 999px; background: var(--line); position: relative; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                         border-radius: 50%; background: var(--card); transition: left .15s ease; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { left: 18px; }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wf-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; color: var(--muted); font-size: 13px; }
  .wf-sub span { display: inline-flex; align-items: center; gap: 6px; }
  .wf-problems { background: var(--notice); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .wf-problems ul { margin: 4px 0 0; padding-left: 18px; }
  .wf-notes { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .wf-notes ul { margin: 4px 0 0; padding-left: 18px; color: var(--fg); }
  .wf-test { background: var(--card); border: 1px solid var(--line); border-radius: 10px; max-width: 760px; }
  .wf-test > .t-top { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 14px; }
  .wf-test > .t-top .link { margin-left: auto; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
  /* The lane scrolls sideways when it is longer than the screen. Its right
     edge fades out, which shows that there is more. */
  .lane { display: flex; align-items: flex-start; overflow-x: auto; padding: 4px 32px 14px 2px;
          -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
          mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
  .lane .join { flex: none; width: 26px; height: 40px; position: relative; }
  .lane .join::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; border-top: 2px solid var(--line); }
  .wcard { flex: none; width: 224px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .wcard.missing { border-color: var(--err); }
  /* The card of a loop holds the cards of the steps inside it, top to bottom. */
  .wcard.holds { width: 272px; }
  .inner { display: flex; flex-direction: column; }
  .inner .wcard { width: auto; background: var(--bg); }
  .inner .wcard .val { background: var(--card); }
  .inner .vjoin { height: 12px; position: relative; }
  .inner .vjoin::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid var(--line); }
  .wc-head { display: flex; align-items: center; gap: 9px; padding: 9px 10px 2px; }
  .wc-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .wc-title small { color: var(--muted); font-size: 12px; }
  .wc-title strong { font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
  .num { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px;
         background: var(--k); color: var(--card); font-size: 11px; font-weight: 700; flex: none; align-self: flex-start; }
  .wc-kind { padding: 0 10px 8px; color: var(--k); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .wc-sec { border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
  .wc-field { display: flex; flex-direction: column; gap: 2px; }
  .wc-field label, .outs-l { font-size: 12px; color: var(--muted); }
  .val { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 4px 7px; font-size: 13px;
         line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; min-height: 28px; }
  .val .expr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .val .row-line { display: flex; flex-wrap: wrap; gap: 2px 6px; }
  .val .row-line code { font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px 0 2px; margin: 1px; border-radius: 999px;
          background: var(--ks); color: var(--k); font: 12px/18px system-ui, -apple-system, "Segoe UI", sans-serif;
          white-space: nowrap; vertical-align: baseline; }
  .pill.plain { padding-left: 7px; }
  .pill b { display: inline-grid; place-items: center; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 999px;
            background: var(--k); color: var(--card); font-size: 10px; font-weight: 700; }
  .outs { display: flex; flex-wrap: wrap; gap: 2px; }
  .runs { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  details.run { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  details.run summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 9px 12px; cursor: pointer; list-style: none; }
  details.run summary::-webkit-details-marker { display: none; }
  details.run summary .run-when { font-weight: 600; }
  details.run summary .run-how { color: var(--muted); font-size: 13px; }
  details.run summary .run-out { flex: 1 1 100%; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .trace { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .tstep { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 9px; }
  .tstep .num { grid-row: span 4; }
  .tstep .t-head { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .tstep .t-head small { color: var(--muted); font-size: 12px; }
  .tstep .kv { grid-column: 2; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .tstep .kv b { color: var(--fg); font-weight: 500; }
  .tstep .kv.err { color: var(--err); }
  /* Editing: the inputs of the cards are form controls. */
  .lane.editing .wcard { width: 300px; }
  .lane.editing .wcard.holds { width: 340px; }
  .lane.editing .inner .wcard { width: auto; }
  .wf-name-edit { flex: 1 1 220px; min-width: 0; margin-right: auto; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); font: inherit; font-size: 17px; font-weight: 600; }
  .wf-sub input { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card);
                  color: var(--fg); font: inherit; min-width: 0; width: 220px; max-width: 100%; }
  .wc-ftop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .wc-field .hint { font-size: 12px; color: var(--muted); }
  .wcard textarea, .wcard select, .wcard input[type=text] {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
    font: inherit; font-size: 13px; line-height: 1.5; padding: 4px 7px; }
  .wcard textarea { resize: none; overflow: hidden; display: block; min-height: 30px; }
  .wcard textarea:focus, .wcard select:focus, .wcard input[type=text]:focus, .wf-name-edit:focus, .wf-sub input:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; }
  .inner .wcard textarea, .inner .wcard select, .inner .wcard input[type=text] { background: var(--card); }
  .ins { font-size: 12px; padding: 0 2px; }
  #workflow-new { margin: 10px 0 0 10px; }
  /* Where a step can be added: on the line between two cards, and after the last. */
  .lane.editing .join, .inner .vjoin.add { display: grid; place-items: center; }
  .lane.editing .join { width: 44px; }
  .addb { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
          background: var(--card); color: var(--accent); font-size: 17px; line-height: 1; padding: 0; }
  .addb:hover, .addb:focus-visible { border-color: var(--accent); outline: none; }
  .inner .vjoin.add { height: 34px; }
  .wc-tools { display: flex; gap: 4px; padding: 0 10px 8px; }
  .wc-tools button { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg);
                     font-size: 12px; padding: 2px 8px; }
  .wc-tools button:hover:not(:disabled) { border-color: var(--accent); }
  .wc-tools button:disabled { opacity: .35; cursor: default; }
  .wc-tools .rm { margin-left: auto; }
  .wc-tools .rm:hover { border-color: var(--err); color: var(--err); }
  /* Earlier and later are left and right in the lane, up and down in a column. */
  .wc-tools .v, .inner .wc-tools .h { display: none; }
  .inner .wc-tools .v { display: inline; }
  .danger { color: var(--err); margin-left: auto; }
  .sheet input[type=search] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
                              background: var(--bg); color: var(--fg); font: inherit; }
  .sheet .opt { display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 7px 9px; border-radius: 8px;
                border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .sheet .opt:hover:not(:disabled), .sheet .opt:focus-visible { border-color: var(--accent); outline: none; }
  .sheet .opt:disabled { opacity: .55; cursor: default; }
  .sheet .opt small { color: var(--muted); font-size: 12px; }
  .sheet .opt .why { color: var(--err); }
  .sheet h4 { margin: 4px 0 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .erows { display: flex; flex-direction: column; gap: 8px; }
  .erow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 6px; align-items: center;
          border-left: 2px solid var(--line); padding-left: 7px; }
  .erow textarea { grid-column: 1; }
  .erow .x { background: none; border: 0; color: var(--muted); padding: 2px 6px; font-size: 15px; line-height: 1; }
  .erow .x:hover { color: var(--err); }
  .sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .35); display: flex;
                align-items: center; justify-content: center; }
  .sheet { background: var(--card); color: var(--fg); width: min(480px, 100%); max-height: 70vh; overflow-y: auto;
           border-radius: 14px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;
           box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  .sheet h3 { margin: 0; font-size: 15px; }
  .sheet .grp { display: flex; flex-direction: column; gap: 5px; }
  .sheet .grp-h { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .sheet .picks { display: flex; flex-wrap: wrap; gap: 5px; }
  .sheet button.pill { border: 0; cursor: pointer; font-size: 13px; line-height: 26px; padding: 0 11px; margin: 0; }
  .sheet button.pill:hover, .sheet button.pill:focus-visible { outline: 2px solid var(--k); }
  .sheet .foot { font-size: 12px; color: var(--muted); }
  .rounds { grid-column: 2; display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
  details.round { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  details.round summary { display: flex; align-items: center; gap: 8px; padding: 5px 9px; cursor: pointer; font-size: 13px; list-style: none; }
  details.round summary::-webkit-details-marker { display: none; }
  details.round summary small { color: var(--muted); }
  details.round .trace { padding: 8px 9px; }
  .round.side { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .round.side .side-h { padding: 5px 9px; font-size: 13px; color: var(--muted); }
  .round.side .trace { padding: 8px 9px; border-top: 1px solid var(--line); }
  .sheet .mem { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  .sheet .mem-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 4px 4px 10px; }
  .sheet .mem-row + .mem-row { border-top: 1px solid var(--line); }
  .sheet .mem-row code { font-size: 12px; overflow-wrap: anywhere; }
  /* What a step asked, and the answer, as the two sides of a chat. */
  .talk { grid-column: 2; display: flex; flex-direction: column; gap: 3px; margin: 4px 0; max-width: 460px; font-size: 13px; }
  .talk-q, .talk-a { padding: 4px 9px; border-radius: 9px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .talk-q { align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); }
  .talk-a { align-self: flex-end; background: var(--mine); }
  @media (max-width: 720px) {
    .lane { flex-direction: column; align-items: stretch; overflow-x: visible; padding-right: 2px;
            -webkit-mask-image: none; mask-image: none; }
    .wcard, .wcard.holds, .lane.editing .wcard, .lane.editing .wcard.holds { width: auto; }
    /* Smaller text in a box makes a phone zoom in on it. */
    .wcard textarea, .wcard select, .wcard input[type=text], .wf-sub input { font-size: 16px; }
    .sheet-back { align-items: flex-end; }
    .sheet { border-radius: 14px 14px 0 0; }
    .sheet input[type=search] { font-size: 16px; }
    .lane.editing .join { width: auto; height: 38px; }
    .wc-tools .h { display: none; }
    .wc-tools .v { display: inline; }
    .lane .join { width: auto; height: 16px; }
    .lane .join::before { left: 50%; right: auto; top: 0; bottom: 0; border-top: 0; border-left: 2px solid var(--line); }
  }
  /* The header must never be wider than the screen: the title gives way. */
  header h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account { max-width: 720px; display: flex; flex-direction: column; gap: 14px; }
  .account h2 { font-size: 17px; margin: 0; }
  .account .row-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .account .row-line span { overflow-wrap: anywhere; }
  /* On a phone the header holds the title and the buttons, on one line. */
  @media (max-width: 720px) { #who { display: none; } header { gap: 8px; padding: 10px 12px; } }
  /* On a phone the messages fill the screen, and the list on the left
     (commands, or the plugins in Settings) is a drawer that slides in. */
  #drawer-toggle { display: none; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--fg); }
  #scrim { display: none; }
  @media (max-width: 720px) {
    #drawer-toggle { display: inline-block; }
    .layout { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(84vw, 320px);
            padding-top: calc(12px + env(safe-area-inset-top));
            transform: translateX(-100%); visibility: hidden;
            transition: transform .2s ease, visibility 0s linear .2s; }
    body.drawer-open aside { transform: none; visibility: visible; transition: transform .2s ease;
                             box-shadow: 0 0 24px rgba(0, 0, 0, .25); }
    #scrim { display: block; position: fixed; z-index: 15; inset: 0; background: rgba(0, 0, 0, .4);
             opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    body.drawer-open #scrim { opacity: 1; pointer-events: auto; }
  }
  @media (prefers-reduced-motion: reduce) { aside, #scrim, .switch input::after { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <button id="drawer-toggle" class="link" aria-label="Commands" aria-expanded="false">☰</button>
    <h1>Spanreed</h1>
    <span id="conn" class="conn" hidden>Reconnecting…</span>
    <span id="who" class="who"></span>
    <button id="push-toggle" class="link" hidden></button>
    <button id="workflows-toggle" class="link">Workflows</button>
    <button id="settings-toggle" class="link">Settings</button>
  </header>
  <div class="layout" id="commands-view">
    <aside>
      <h2>Commands</h2>
      <input id="filter" type="search" placeholder="Filter commands" autocomplete="off">
      <nav id="commands"></nav>
    </aside>
    <main>
      <div id="log" aria-live="polite"></div>
      <div id="dock"></div>
    </main>
  </div>
  <div class="layout" id="workflows" hidden>
    <aside>
      <h2>Workflows</h2>
      <nav id="workflow-list"></nav>
      <button class="small" id="workflow-new" type="button">New workflow</button>
    </aside>
    <div id="workflow-main"></div>
  </div>
  <div class="layout" id="settings" hidden>
    <aside>
      <h2>Settings</h2>
      <nav id="settings-plugins"></nav>
    </aside>
    <div id="settings-main"></div>
  </div>
  <div id="scrim"></div>
</div>
<script>
"use strict";
const HEADERS = { "X-Spanreed-Request": "1", "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
let seq = 0, openPrompt = null, activeFlowId = null, commands = [];
const bubbles = new Map();

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function api(path, options = {}) {
  const res = await fetch("/app/api/" + path, { credentials: "same-origin", ...options });
  if (res.status === 401) { location.reload(); throw new Error("logged out"); }
  return res;
}
const post = (path, body) => api(path, { method: "POST", headers: HEADERS, body: JSON.stringify(body || {}) });

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

function addBubble(html, cls, id) {
  $("log").querySelector(".empty")?.remove();
  const b = el("div", "bubble" + (cls ? " " + cls : ""));
  b.innerHTML = html;  // server-sanitized
  if (id) bubbles.set(id, b);
  $("log").append(b);
  return b;
}
function addSys(text, isError) {
  $("log").querySelector(".empty")?.remove();
  $("log").append(el("div", "sys" + (isError ? " err" : ""), text));
}

function apply(ev) {
  switch (ev.type) {
    case "message": addBubble(ev.html, "", ev.id); break;
    case "notification": addBubble("🔔 " + ev.html, "notice"); break;
    case "edit": { const b = bubbles.get(ev.id); if (b) b.innerHTML = ev.html; break; }
    case "delete": { const b = bubbles.get(ev.id); if (b) { b.remove(); bubbles.delete(ev.id); } break; }
    case "document": {
      const b = addBubble("", "", ev.id);
      const a = el("a", "", "📎 " + ev.name);
      a.href = "/app/api/documents/" + encodeURIComponent(ev.id);
      b.append(a);
      break;
    }
    case "prompt": addBubble(ev.html); openPrompt = ev; break;
    case "close-prompt": if (openPrompt && openPrompt.interaction_id === ev.interaction_id) openPrompt = null; break;
    case "answer": addBubble("", "mine").textContent = ev.text; break;
    case "flow-started": activeFlowId = ev.flow_id; addSys("▶ " + ev.title); break;
    case "flow-finished":
      if (ev.flow_id === activeFlowId) activeFlowId = null;
      if (ev.error && ev.error !== "Cancelled.") addSys(ev.error, true);
      else addSys(ev.error ? "Cancelled" : "Done");
      break;
  }
}

function renderDock() {
  const dock = $("dock");
  dock.replaceChildren();
  if (openPrompt) {
    const p = openPrompt;
    if (p.kind === "choice" && p.rows) {
      const rows = el("div", "rows");
      for (const row of p.rows) {
        const r = el("div", "row");
        for (const btn of row) {
          const button = el("button", "", btn.label);
          button.onclick = () => answer(p.interaction_id, btn.value);
          r.append(button);
        }
        rows.append(r);
      }
      dock.append(rows);
    } else {
      const form = el("form", "input");
      const ta = el("textarea");
      ta.rows = 1; ta.placeholder = "Type your answer…"; ta.required = true;
      ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
      form.append(ta, el("button", "primary", "Send"));
      form.onsubmit = (e) => { e.preventDefault(); if (ta.value.trim()) answer(p.interaction_id, ta.value); };
      dock.append(form);
      setTimeout(() => ta.focus(), 0);
    }
  }
  if (openPrompt || activeFlowId) {
    const status = el("div", "status");
    status.append(el("span", "", openPrompt ? "Waiting for your answer" : "Running…"));
    const cancel = el("button", "link", "Cancel");
    cancel.onclick = () => post("cancel", openPrompt ? { interaction_id: openPrompt.interaction_id } : {});
    status.append(cancel);
    if (openPrompt) dock.prepend(status); else dock.append(status);
  }
}

async function answer(interactionId, value) {
  const res = await post("answer", { interaction_id: interactionId, value });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    addSys(body.error || "Could not send your answer.", true);
    if (openPrompt && openPrompt.interaction_id === interactionId) { openPrompt = null; renderDock(); }
  }
}

function renderCommands() {
  const nav = $("commands"), q = $("filter").value.trim().toLowerCase();
  nav.replaceChildren();
  for (const c of commands) {
    if (q && !c.text.toLowerCase().includes(q) && !c.plugin.includes(q)) continue;
    const b = el("button", "cmd", c.text);
    b.append(el("small", "", c.plugin));
    b.onclick = () => run(c);
    nav.append(b);
  }
  if (!nav.children.length) nav.append(el("p", "sys", commands.length ? "No match" : "No commands"));
}

async function run(c) {
  if ((activeFlowId || openPrompt) &&
      !confirm(`Stop what's running and start "${c.text}"?`)) return;
  setDrawer(false);
  const res = await post("commands/" + encodeURIComponent(c.id) + "/run");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    addSys(body.error || "Could not start the command.", true);
    loadState();
  }
}

// Who is logged in and their Google link, shown under Settings → Account.
let account = { name: "", google: null };

function renderAccount() {
  const box = el("div", "account");
  box.append(el("h2", "", "Account"));
  box.append(el("div", "", "Logged in as " + account.name + "."));

  const google = account.google;
  if (google && google.available) {
    const field = el("div", "field");
    field.append(el("div", "name", "Google sign-in"));
    const line = el("div", "row-line");
    if (google.email) {
      line.append(el("span", "", "Linked to " + google.email + "."));
      const unlink = el("button", "small", "Unlink Google");
      unlink.onclick = async () => {
        if (!confirm("Unlink " + google.email + "? You'll need a login link to log in on new devices.")) return;
        await post("google/unlink");
        await loadState();
        if (currentSettings === ACCOUNT) renderAccount();
      };
      line.append(unlink);
    } else {
      line.append(el("span", "", "Not linked."));
      // A real form POST: the server answers with a redirect to Google.
      const form = el("form");
      form.method = "post"; form.action = "/app/google/link";
      form.append(el("button", "small", "Link Google account"));
      line.append(form);
    }
    field.append(line);
    field.append(el("div", "help",
      "A linked Google account lets you sign in on a new device without a login link."));
    box.append(field);
  }

  const logout = el("button", "small", "Log out");
  logout.onclick = async () => { await post("logout"); location.reload(); };
  box.append(logout);
  $("settings-main").replaceChildren(box);
}

// --- Push notifications: this device's subscription. ---

let pushKey = null, pushRegistration = null;

function keyBytes(base64url) {
  const pad = "=".repeat((4 - (base64url.length % 4)) % 4);
  const raw = atob((base64url + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

function renderPushToggle(on, note) {
  const button = $("push-toggle");
  button.hidden = false;
  button.textContent = note || (on ? "🔔 On" : "🔕 Off");
  button.title = on ? "Notifications are on for this device" : "Turn on notifications for this device";
  button.onclick = on ? disablePush : enablePush;
}

async function setupPush(publicKey) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return;
  pushKey = publicKey;
  try {
    pushRegistration = await navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" });
    const sub = await pushRegistration.pushManager.getSubscription();
    if (sub) {
      // Send it again on every load, so the server relearns a subscription it lost.
      const res = await post("push/subscribe", { subscription: sub.toJSON() });
      renderPushToggle(res.ok);
    } else {
      renderPushToggle(false);
    }
  } catch (e) {
    console.warn("Push setup failed", e);
  }
}

async function enablePush() {
  if (!pushRegistration) return;
  try {
    if (await Notification.requestPermission() !== "granted") {
      addSys("Notifications are blocked for this site. Allow them in the browser's site settings.", true);
      return;
    }
    renderPushToggle(false, "🔔 …");
    const sub = await pushRegistration.pushManager.subscribe(
      { userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
    const res = await post("push/subscribe", { subscription: sub.toJSON(), test: true });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      await sub.unsubscribe();
      throw new Error(body.error || "The server did not accept the subscription.");
    }
    renderPushToggle(true);
    addSys("Notifications are on for this device. A test notification is on its way.");
  } catch (e) {
    renderPushToggle(false);
    addSys("Could not turn on notifications: " + e.message, true);
  }
}

async function disablePush() {
  if (!confirm("Turn off notifications on this device?")) return;
  const sub = pushRegistration && await pushRegistration.pushManager.getSubscription();
  if (sub) {
    await post("push/unsubscribe", { endpoint: sub.endpoint });
    await sub.unsubscribe();
  }
  renderPushToggle(false);
}

async function loadState() {
  const res = await api("state");
  const s = await res.json();
  if (pushKey === null && s.push) setupPush(s.push.public_key);
  $("who").textContent = s.user.name;
  account = { name: s.user.name, google: s.google };
  commands = s.commands; renderCommands();
  $("log").replaceChildren(); bubbles.clear();
  openPrompt = null;
  if (!s.events.length) {
    $("log").append(el("p", "empty",
      "Pick a command from the list. Its questions and messages show up here, " +
      "without going through Telegram."));
  }
  for (const ev of s.events) apply(ev);
  openPrompt = s.open_prompt; activeFlowId = s.active_flow_id; seq = s.seq;
  renderDock(); scrollDown();
}

async function poll() {
  for (;;) {
    try {
      const res = await api("events?after=" + seq);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      $("conn").hidden = true;
      if (data.reset) { await loadState(); continue; }
      for (const ev of data.events) apply(ev);
      seq = data.seq;
      if (data.events.length) { renderDock(); scrollDown(); }
    } catch (e) {
      $("conn").hidden = false;
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
}

// --- Plugin settings: a form built from the schema the server sends. ---

let fieldCounter = 0;

// Each build* function returns { node, read }. read() returns the value to
// submit and throws an Error with a message for the user if it can't.
function buildField(schema, value, label) {
  switch (schema.kind) {
    case "object": return buildObject(schema, value, label);
    case "list": return buildList(schema, value, label);
    case "boolean": return buildBoolean(schema, value, label);
    case "choice": return buildChoice(schema, value, label);
    case "json": return buildJson(schema, value, label);
    default: return buildScalar(schema, value, label);
  }
}

function wrap(schema, label, control, cls) {
  const box = el("div", "field" + (cls ? " " + cls : ""));
  if (label) {
    const l = el("label", "", label);
    control.id = control.id || "f" + (++fieldCounter);
    l.htmlFor = control.id;
    if (cls === "check") box.append(control, l); else box.append(l, control);
  } else {
    box.append(control);
  }
  if (schema.help) box.append(el("div", "help", schema.help));
  return box;
}

function buildScalar(schema, value, label) {
  const isNumber = schema.kind === "integer" || schema.kind === "number";
  const text = value === null || value === undefined ? "" : String(value);
  let input;
  if (schema.mode === "secret") {
    input = el("input");
    input.type = "password"; input.autocomplete = "new-password";
    input.placeholder = "Leave empty to keep the current value";
  } else if (isNumber) {
    input = el("input");
    input.type = "number"; input.step = schema.kind === "integer" ? "1" : "any";
    input.value = text;
  } else if (text.includes("\n") || text.length > 70 || /template|content/.test(schema.name || "")) {
    input = el("textarea");
    input.rows = Math.min(12, Math.max(2, text.split("\n").length));
    input.value = text;
  } else {
    input = el("input");
    input.type = "text"; input.value = text;
  }
  if (schema.optional && schema.mode !== "secret") input.placeholder = "Not set";
  const read = () => {
    const raw = input.value;
    if (schema.mode === "secret") return raw;
    if (isNumber) {
      if (raw.trim() === "") {
        if (schema.optional) return null;
        throw new Error((label || "A number") + ": a value is required.");
      }
      const n = Number(raw);
      if (!Number.isFinite(n)) throw new Error((label || "A number") + ": not a number.");
      return n;
    }
    return raw === "" && schema.optional ? null : raw;
  };
  return { node: wrap(schema, label, input), read };
}

function buildBoolean(schema, value, label) {
  if (schema.optional) {
    const select = el("select");
    for (const [v, text] of [["", "Not set"], ["true", "Yes"], ["false", "No"]]) {
      const o = el("option", "", text); o.value = v; select.append(o);
    }
    select.value = value === null || value === undefined ? "" : String(value);
    return { node: wrap(schema, label, select),
             read: () => select.value === "" ? null : select.value === "true" };
  }
  const box = el("input");
  box.type = "checkbox"; box.checked = value === true;
  return { node: wrap(schema, label, box, "check"), read: () => box.checked };
}

function buildChoice(schema, value, label) {
  const select = el("select");
  if (schema.optional) { const o = el("option", "", "Not set"); o.value = ""; select.append(o); }
  for (const choice of schema.choices) {
    const o = el("option", "", choice); o.value = choice; select.append(o);
  }
  select.value = value === null || value === undefined ? "" : value;
  return { node: wrap(schema, label, select),
           read: () => select.value === "" && schema.optional ? null : select.value };
}

function buildJson(schema, value, label) {
  const ta = el("textarea", "code");
  const text = value === null || value === undefined ? "" : JSON.stringify(value, null, 2);
  ta.value = text; ta.spellcheck = false;
  ta.rows = Math.min(14, Math.max(3, text.split("\n").length));
  ta.placeholder = "JSON";
  const read = () => {
    if (ta.value.trim() === "") {
      if (schema.optional) return null;
      throw new Error((label || "JSON") + ": a value is required.");
    }
    try { return JSON.parse(ta.value); }
    catch (e) { throw new Error((label || "JSON") + ": not valid JSON."); }
  };
  return { node: wrap(schema, label, ta), read };
}

function buildObject(schema, value, label) {
  const box = el("div", "field");
  if (label) box.append(el("div", "name", label));
  if (schema.help) box.append(el("div", "help", schema.help));
  const group = el("div", "group");
  let parts = null;  // null while an optional group is not set
  const fill = (v) => {
    group.replaceChildren();
    parts = schema.fields.map((f) => {
      const built = buildField(f, v ? v[f.name] : undefined, f.label);
      group.append(built.node);
      return [f.name, built];
    });
  };
  if (schema.optional) {
    const toggle = el("button", "small");
    toggle.type = "button";
    const show = (v) => {
      if (v === null || v === undefined) {
        parts = null; group.replaceChildren(); group.hidden = true;
        toggle.textContent = "Add " + (label || "this").toLowerCase();
      } else {
        fill(v); group.hidden = false;
        toggle.textContent = "Remove " + (label || "this").toLowerCase();
      }
    };
    toggle.onclick = () => show(parts === null ? schema.blank : null);
    box.append(toggle, group);
    show(value);
  } else {
    box.append(group);
    fill(value || {});
  }
  const read = () => {
    if (parts === null) return null;
    const out = {};
    for (const [name, built] of parts) out[name] = built.read();
    return out;
  };
  return { node: box, read };
}

function buildList(schema, value, label) {
  const box = el("div", "field");
  if (label) box.append(el("div", "name", label));
  if (schema.help) box.append(el("div", "help", schema.help));
  const list = el("div", "rows");
  const items = [];
  const one = (label || "item").toLowerCase().replace(/s$/, "");
  const renumber = () => items.forEach((item, i) => {
    item.title.textContent = "#" + (i + 1);
    item.up.disabled = i === 0; item.down.disabled = i === items.length - 1;
  });
  const move = (item, by) => {
    const i = items.indexOf(item), j = i + by;
    if (j < 0 || j >= items.length) return;
    items.splice(i, 1); items.splice(j, 0, item);
    list.replaceChildren(...items.map((it) => it.node));
    renumber();
  };
  const add = (v) => {
    const built = buildField(schema.item, v, "");
    // The item already has a frame, so its own fields need no second one.
    const inner = built.node.querySelector(":scope > .group");
    if (inner) inner.className = "fields";
    const item = { built, node: el("div", "group"), title: el("span"),
                   up: el("button", "small", "↑"), down: el("button", "small", "↓") };
    const remove = el("button", "small", "Remove");
    for (const b of [item.up, item.down, remove]) b.type = "button";
    item.up.title = "Move up"; item.down.title = "Move down";
    item.up.onclick = () => move(item, -1);
    item.down.onclick = () => move(item, 1);
    remove.onclick = () => { items.splice(items.indexOf(item), 1); item.node.remove(); renumber(); };
    const head = el("div", "item-head");
    head.append(item.title, item.up, item.down, remove);
    item.node.append(head, built.node);
    items.push(item); list.append(item.node); renumber();
  };
  for (const v of value || []) add(v);
  const more = el("button", "small", "Add " + one);
  more.type = "button";
  // A copy, so that two new items never share one object.
  more.onclick = () => add(JSON.parse(JSON.stringify(schema.blank)));
  box.append(list, more);
  return { node: box, read: () => items.map((item) => item.built.read()) };
}

let settingsPlugins = [], currentSettings = null;

const ACCOUNT = "__account";

function renderSettingsNav() {
  const nav = $("settings-plugins");
  nav.replaceChildren();
  const accountItem = el("button", "cmd" + (currentSettings === ACCOUNT ? " current" : ""), "Account");
  accountItem.onclick = () => openSettings(ACCOUNT);
  nav.append(accountItem);
  for (const p of settingsPlugins) {
    const b = el("button", "cmd" + (p.id === currentSettings ? " current" : ""), p.name);
    b.onclick = () => openSettings(p.id);
    nav.append(b);
  }
}

function renderSettingsForm(data) {
  const main = $("settings-main");
  const form = el("form");
  form.append(el("h2", "", data.name));
  const built = buildObject({ ...data.schema, optional: false }, data.value, "");
  // The top level needs no frame around it.
  built.node.querySelector(".group").className = "fields";
  const status = el("span");
  const save = el("button", "primary", "Save");
  const row = el("div", "save-row");
  row.append(save, status);
  form.append(built.node, row);
  form.oninput = () => { status.textContent = ""; };
  form.onsubmit = async (e) => {
    e.preventDefault();
    let value;
    try { value = built.read(); }
    catch (err) { status.className = "err"; status.textContent = err.message; return; }
    save.disabled = true; status.className = "ok"; status.textContent = "Saving…";
    try {
      const res = await api("settings/" + encodeURIComponent(data.id),
        { method: "PUT", headers: HEADERS, body: JSON.stringify({ value }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "Could not save the settings.");
      renderSettingsForm(body);
      $("settings-main").querySelector(".save-row span").textContent = "Saved.";
    } catch (err) {
      status.className = "err"; status.textContent = err.message;
    } finally {
      save.disabled = false;
    }
  };
  main.replaceChildren(form);
  main.querySelector(".save-row span").className = "ok";
}

async function openSettings(id) {
  setDrawer(false);
  currentSettings = id;
  renderSettingsNav();
  if (id === ACCOUNT) { renderAccount(); return; }
  const main = $("settings-main");
  main.replaceChildren(el("p", "sys", "Loading…"));
  const res = await api("settings/" + encodeURIComponent(id));
  if (currentSettings !== id) return;
  if (!res.ok) { main.replaceChildren(el("p", "sys err", "Could not load these settings.")); return; }
  renderSettingsForm(await res.json());
}

async function loadSettings() {
  const res = await api("settings");
  settingsPlugins = res.ok ? (await res.json()).plugins : [];
  if (currentSettings !== ACCOUNT && !settingsPlugins.some((p) => p.id === currentSettings)) {
    currentSettings = null;
  }
  renderSettingsNav();
  if (currentSettings) return;
  openSettings(settingsPlugins.length ? settingsPlugins[0].id : ACCOUNT);
}

// --- Workflows: the list, and one workflow's steps and runs. ---

let currentWorkflow = null, workflowTab = "steps";

// A short mark for a plugin: "HC" for Health Connect, "To" for Todoist.
function monogram(app) {
  const words = app.split(/\s+/).filter(Boolean);
  if (!words.length) return "?";
  return words.length > 1 ? words[0][0] + words[1][0] : app.slice(0, 2);
}
function glyph(app, kind, small) {
  const g = el("span", "glyph k-" + kind + (small ? " sm" : ""), monogram(app));
  g.title = app || "Unknown block";
  return g;
}

function when(iso) {
  const d = new Date(iso);
  if (d.toDateString() === new Date().toDateString()) {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  return d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
}
const runDot = (run) => run.status === "failed" ? "bad" : run.status === "cancelled" ? "off" : "";

// What the list and the head say about a workflow: a dot and a line.
function workflowStatus(w) {
  if (w.problem || (w.problems && w.problems.length)) return { dot: "bad", text: "Cannot run" };
  if (!w.enabled) return { dot: "off", text: "Off" };
  if (!w.last_run) return { dot: "", text: "Has not run yet" };
  const run = w.last_run;
  return { dot: runDot(run), text: "Last run " + when(run.started_at) + ": " + run.outcome };
}

function renderWorkflowNav(list) {
  const nav = $("workflow-list");
  nav.replaceChildren();
  for (const w of list) {
    const status = workflowStatus(w);
    const b = el("button", "cmd wf" + (w.id === currentWorkflow ? " current" : ""));
    const name = el("span", "wf-name");
    name.append(el("span", "dot " + status.dot), el("span", "", w.name));
    const chain = el("span", "chain");
    for (const a of w.apps) chain.append(glyph(a.app, a.kind, true));
    b.append(name, chain, el("small", "", status.text));
    b.onclick = () => openWorkflow(w.id);
    nav.append(b);
  }
}

async function loadWorkflows() {
  const main = $("workflow-main");
  const res = await api("workflows");
  if (view !== "workflows") return;
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    $("workflow-list").replaceChildren();
    main.replaceChildren(el("p", "sys err", body.error || "Could not load the workflows."));
    return;
  }
  const list = (await res.json()).workflows;
  if (!list.some((w) => w.id === currentWorkflow)) currentWorkflow = null;
  renderWorkflowNav(list);
  if (!list.length) {
    main.replaceChildren(el("p", "empty", "You have no workflows yet. “New workflow” adds one."));
    return;
  }
  openWorkflow(currentWorkflow || list[0].id);
}

// --- What a workflow can be made of: the blocks of the plugins, and the recipes. ---

let catalog = null;
async function loadCatalog() {
  const res = await api("workflows/catalog");
  if (res.ok) catalog = await res.json();
  return res.ok;
}

// A sheet with a list to pick from. `fill` gets the sheet and a function
// that closes it.
function openSheet(label, fill) {
  const back = el("div", "sheet-back"), sheet = el("div", "sheet");
  sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", label);
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };
  sheet.append(el("h3", "", label));
  fill(sheet, close);
  back.append(sheet);
  back.onclick = (e) => { if (e.target === back) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.append(back);
  return sheet;
}

// One thing to pick: a title, a line about it, and why it cannot be picked.
// `todo` says that the reason is something the user can do about.
function option(title, about, why, onPick, todo = true) {
  const b = el("button", "opt");
  b.type = "button";
  b.append(el("strong", "", title));
  if (about) b.append(el("small", "", about));
  if (why) { b.append(el("small", todo ? "why" : "", why)); b.disabled = true; }
  else b.onclick = onPick;
  return b;
}

const setUpFirst = (apps) => "Set up " + apps.join(" and ") + " with “Manage plugins” first.";

async function newWorkflow() {
  if (!mayLeaveEditor()) return;
  if (!await loadCatalog()) { $("workflow-main").prepend(el("p", "sys err", "Could not load the recipes.")); return; }
  setDrawer(false);
  openSheet("New workflow", (sheet, close) => {
    const make = async (body, thenEdit) => {
      close();
      const res = await post("workflows", body);
      const answer = await res.json().catch(() => ({}));
      if (!res.ok) { $("workflow-main").prepend(el("p", "sys err", answer.error || "Could not add the workflow.")); return; }
      currentWorkflow = answer.id;
      await loadWorkflows();
      // A workflow with only a trigger is there to be filled in.
      if (thenEdit) startEditing(answer);
    };
    sheet.append(el("h4", "", "From a recipe"));
    for (const recipe of catalog.recipes) {
      const why = recipe.installed ? "You have this one." : recipe.missing.length ? setUpFirst(recipe.missing) : "";
      sheet.append(option(recipe.name, recipe.description, why, () => make({ recipe: recipe.id }, false), !recipe.installed));
    }
    sheet.append(el("h4", "", "Or start with a trigger"));
    for (const block of catalog.blocks.filter((b) => b.kind === "trigger")) {
      sheet.append(option(block.title, block.app + " · " + block.description, block.connected ? "" : setUpFirst([block.app]),
                          () => make({ trigger: block.block }, true)));
    }
  });
}
$("workflow-new").onclick = newWorkflow;

async function openWorkflow(id) {
  if (draft && draft.id !== id && !mayLeaveEditor()) return;
  setDrawer(false);
  currentWorkflow = id;
  for (const b of $("workflow-list").children) b.classList.remove("current");
  const res = await api("workflows/" + encodeURIComponent(id));
  if (currentWorkflow !== id) return;
  if (!res.ok) {
    $("workflow-main").replaceChildren(el("p", "sys err", "Could not load this workflow."));
    return;
  }
  renderWorkflow(await res.json());
  // The list shows the same state, so read it again.
  const list = await api("workflows");
  if (list.ok && view === "workflows") renderWorkflowNav((await list.json()).workflows);
}

// A value that an earlier card gave: its number (T for the trigger) and name.
function pill(source, path, sources) {
  const from = sources[source];
  const p = el("span", "pill k-" + from.kind);
  p.append(el("b", "", from.badge), document.createTextNode(path));
  return p;
}

// Text as it is stored, with each {{ ... }} drawn as what it refers to.
const REFERENCE = /\b([a-z][a-z0-9_]*)\.([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)/g;
function richText(text, sources) {
  const out = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(/\{\{(.*?)\}\}/gs)) {
    if (m.index > last) out.append(text.slice(last, m.index));
    const expression = m[1].trim(), box = el("span", "expr");
    let at = 0;
    for (const r of expression.matchAll(REFERENCE)) {
      if (!(r[1] in sources)) continue;
      if (r.index > at) box.append(expression.slice(at, r.index));
      box.append(pill(r[1], r[2], sources));
      at = r.index + r[0].length;
    }
    if (at < expression.length) box.append(expression.slice(at));
    out.append(box);
    last = m.index + m[0].length;
  }
  if (last < text.length) out.append(text.slice(last));
  return out;
}

const plain = (v) => typeof v === "string" ? v : v === true ? "yes" : v === false ? "no" : JSON.stringify(v);

// A value that is a mapping, one row for each name. The server sends the
// rows as pairs, which keep the order they are stored in.
function richValue(value, sources, pairs) {
  const box = el("div", "val");
  if (pairs || (value && typeof value === "object" && !Array.isArray(value))) {
    for (const [key, v] of pairs || Object.entries(value)) {
      const row = el("div", "row-line");
      row.append(el("code", "", key), "←", richText(plain(v), sources));
      box.append(row);
    }
  } else if (typeof value === "string") {
    box.append(richText(value, sources));
  } else if (Array.isArray(value)) {
    box.append(richText(value.map(plain).join(", "), sources));
  } else {
    box.append(value === null || value === undefined ? "Not set" : plain(value));
  }
  return box;
}

function renderCard(card, badge, sources, edit) {
  // The lists of steps that the card holds: one for a loop, two for a branch.
  // While it is edited, a list shows where its steps go, also while it has none.
  const lanes = (card.lanes || []).filter((lane) => edit || (card[lane.key] || []).length);
  const c = el("div", "wcard k-" + card.kind + (card.missing ? " missing" : "") + (lanes.length ? " holds" : ""));
  const head = el("div", "wc-head"), title = el("div", "wc-title");
  title.append(el("small", "", card.app || "Unknown block"), el("strong", "", card.title));
  head.append(glyph(card.app, card.kind), title, el("span", "num", badge));
  c.append(head, el("div", "wc-kind", card.kind));
  if (edit && edit.list) c.append(stepTools(card, edit));
  if (card.fields.length) {
    const sec = el("div", "wc-sec");
    for (const field of card.fields) {
      if (edit && field.edit) { sec.append(editField(card, field, edit)); continue; }
      const f = el("div", "wc-field");
      f.append(el("label", "", field.label), richValue(field.value, sources, field.pairs));
      sec.append(f);
    }
    c.append(sec);
  }
  if (card.outputs.length) {
    const sec = el("div", "wc-sec"), chips = el("div", "outs");
    for (const name of card.outputs) chips.append(el("span", "pill plain k-" + card.kind, name));
    sec.append(el("div", "outs-l", "Outputs"), chips);
    c.append(sec);
  }
  for (const lane of lanes) {
    const inside = card[lane.key] || [];
    const sec = el("div", "wc-sec"), inner = el("div", "inner");
    // Inside, the card offers what it gives (a loop: the item of the round),
    // and each step offers its outputs to the ones after it in its list.
    let offers = edit ? [...edit.offers, holderOffer(card, edit.cards)] : null;
    const list = edit && draftStep(card.id)[lane.key];
    inside.forEach((step, i) => {
      if (edit) inner.append(addStepButton(list, i, "vjoin add"));
      else if (i) inner.append(el("span", "vjoin"));
      inner.append(renderCard(step, step.number, sources, edit && { ...edit, offers, list, index: i }));
      if (edit) offers = [...offers, offerOf(step)];
    });
    if (edit) inner.append(addStepButton(list, inside.length, "vjoin add"));
    sec.append(el("div", "outs-l", lane.title), inner);
    c.append(sec);
  }
  return c;
}

// Some steps and the steps inside them, in the order they run.
const allSteps = (steps) => steps.flatMap((step) =>
  [step, ...allSteps(step.steps || []), ...allSteps(step.otherwise || [])]);

// The trigger and the steps, left to right. On a phone, top to bottom.
function renderLane(d) {
  const sources = { trigger: { badge: "T", kind: "trigger" }, run: { badge: "run", kind: "logic" } };
  for (const step of allSteps(d.steps)) sources[step.id] = { badge: step.number, kind: step.kind };
  const lane = el("div", "lane");
  lane.append(renderCard(d.trigger, "T", sources));
  for (const step of d.steps) lane.append(el("span", "join"), renderCard(step, step.number, sources));
  return lane;
}

// The lane while a workflow is edited. It is drawn from the draft, which
// holds the steps as they are now: added, removed and moved.
// The draft as cards, numbered as the steps are now.
function draftCards() {
  // The second list of a branch goes on counting where the first stopped.
  const number = (steps, prefix, first) => steps.forEach((step, i) => {
    step.number = prefix + (first + i);
    number(step.steps, step.number + ".", 1);
    number(step.otherwise, step.number + ".", step.steps.length + 1);
  });
  number(draft.steps, "", 1);
  const view = (step) => ({ ...step.card, id: step.id, number: step.number,
                            steps: step.steps.map(view), otherwise: step.otherwise.map(view) });
  return { trigger: { ...draft.trigger.card, id: "trigger" }, steps: draft.steps.map(view) };
}

function renderDraftLane() {
  const shown = draftCards(), trigger = shown.trigger;
  const sources = { trigger: { badge: "T", kind: "trigger" }, run: { badge: "run", kind: "logic" } };
  const cards = { trigger };
  for (const step of allSteps(draft.steps)) {
    sources[step.id] = { badge: step.number, kind: step.card.kind };
    cards[step.id] = step.card;
  }
  const lane = el("div", "lane editing");
  // The trigger starts the run, so there is nothing before it to offer.
  lane.append(renderCard(trigger, "T", sources, { cards, offers: [] }));
  let offers = [{ id: "trigger", badge: "T", kind: "trigger", title: trigger.title, names: trigger.outputs },
                { id: "run", badge: "run", kind: "logic", title: "This run", names: draft.shown.run_outputs }];
  shown.steps.forEach((card, i) => {
    lane.append(addStepButton(draft.steps, i, "join"), renderCard(card, card.number, sources, { cards, offers, list: draft.steps, index: i }));
    offers = [...offers, offerOf(card)];
  });
  lane.append(addStepButton(draft.steps, draft.steps.length, "join"));
  return lane;
}

// --- Editing a workflow: the cards' inputs as form controls. ---

// What the form holds while a workflow is edited: its name, and each input
// of each card as the text of its control. Null when nothing is edited.
let draft = null;

const draftInputs = (card) => Object.fromEntries(card.fields.filter((f) => f.edit).map((f) =>
  [f.name, f.edit.control === "rows" ? f.edit.rows.map((row) => [...row]) : f.edit.text]));
// A step of the draft keeps the card it is drawn from: its title, its
// inputs and how each is edited, its outputs.
const draftSteps = (cards) => cards.map((card) =>
  ({ id: card.id, block: card.block, inputs: draftInputs(card), steps: draftSteps(card.steps || []),
     otherwise: draftSteps(card.otherwise || []), card }));

async function startEditing(d) {
  // The blocks that a step can be added from.
  await loadCatalog();
  draft = { id: d.id, shown: d, changed: false, problems: [], name: d.name, command_name: d.command_name || "",
            trigger: { block: d.trigger.block, params: draftInputs(d.trigger), card: d.trigger },
            steps: draftSteps(d.steps) };
  renderWorkflow(d);
}

// Draw the editor again after the steps changed, where it was scrolled to.
function redrawEditor() {
  const left = document.querySelector(".lane.editing")?.scrollLeft || 0;
  renderWorkflow(draft.shown);
  const lane = document.querySelector(".lane.editing");
  if (lane) lane.scrollLeft = left;
}

function draftStep(id, steps = draft.steps) {
  for (const step of steps) {
    if (step.id === id) return step;
    const inside = draftStep(id, step.steps) || draftStep(id, step.otherwise);
    if (inside) return inside;
  }
  return null;
}

// An id for a new step, after its block: write_note, then write_note_2.
// Words that a template reads as something else than the name of a step.
const RESERVED_IDS = ["and", "or", "not", "in", "is", "if", "else", "true", "false", "none"];
function newStepId(block) {
  let base = block.split(".").pop().replace(/[^a-z0-9]+/g, "_").replace(/^[^a-z]+/, "") || "step";
  if (RESERVED_IDS.includes(base)) base += "_step";
  const used = new Set(["trigger", "run", ...allSteps(draft.steps).map((step) => step.id)]);
  let id = base;
  for (let n = 2; used.has(id); n++) id = base + "_" + n;
  return id;
}

// The + on the line between two cards: a new step at this place of a list.
function addStepButton(list, index, cls) {
  const join = el("span", cls), b = el("button", "addb", "+");
  b.type = "button"; b.title = "Add a step here"; b.setAttribute("aria-label", "Add a step here");
  b.onclick = () => openBlockPicker((entry) => {
    const card = structuredClone(entry.card);
    list.splice(index, 0, { id: newStepId(entry.block), block: entry.block, inputs: draftInputs(card),
                            steps: [], otherwise: [], card });
    draft.changed = true;
    redrawEditor();
  });
  join.append(b);
  return join;
}

// Earlier, later and remove, for a step in its list.
function stepTools(card, edit) {
  const tools = el("div", "wc-tools"), list = edit.list, i = edit.index;
  const tool = (cls, label, parts, enabled, act) => {
    const b = el("button", cls);
    b.type = "button"; b.title = label; b.setAttribute("aria-label", label + ": " + card.title);
    for (const [partClass, text] of parts) b.append(el("span", partClass, text));
    b.disabled = !enabled;
    b.onclick = () => { act(); draft.changed = true; redrawEditor(); };
    return b;
  };
  const swap = (a, b) => { [list[a], list[b]] = [list[b], list[a]]; };
  tools.append(
    tool("", "Move earlier", [["h", "←"], ["v", "↑"]], i > 0, () => swap(i, i - 1)),
    tool("", "Move later", [["h", "→"], ["v", "↓"]], i < list.length - 1, () => swap(i, i + 1)),
    tool("rm", "Remove", [["", "Remove"]], true, () => list.splice(i, 1)));
  return tools;
}

// The blocks a step can be made of, by plugin, with a box to search them.
function openBlockPicker(onPick) {
  if (!catalog) return;
  const sheet = openSheet("Add a step", (sheet, close) => {
    const search = el("input"), results = el("div", "grp");
    search.type = "search"; search.placeholder = "Search: “property”, “message”, “todoist”…";
    search.setAttribute("aria-label", "Search the blocks");
    const draw = () => {
      const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
      results.replaceChildren();
      let app = null;
      for (const block of catalog.blocks) {
        if (block.kind === "trigger") continue;
        const text = (block.title + " " + block.app + " " + block.description).toLowerCase();
        if (!words.every((word) => text.includes(word))) continue;
        if (block.app !== app) { app = block.app; results.append(el("h4", "", app)); }
        results.append(option(block.title, block.description, block.connected ? "" : setUpFirst([block.app]),
                              () => { close(); onPick(block); }));
      }
      if (!results.children.length) results.append(el("div", "foot", "No block matches."));
    };
    search.oninput = draw;
    draw();
    sheet.append(search, results);
  });
  sheet.querySelector("input").focus();
}

// Leaving the editor drops what was changed, so ask first.
function mayLeaveEditor() {
  if (!draft) return true;
  if (draft.changed && !confirm("Discard the changes to “" + draft.name + "”?")) return false;
  draft = null;
  return true;
}

window.addEventListener("beforeunload", (e) => { if (draft && draft.changed) e.preventDefault(); });

// The inputs of a card in the draft.
function inputsOf(card) {
  return card.id === "trigger" ? draft.trigger.params : draftStep(card.id).inputs;
}

// What a card gives to the cards after it, for the list of values to insert.
const offerOf = (card) => ({ id: card.id, badge: card.number, kind: card.kind, title: card.title, names: card.outputs });

// What a card that holds steps gives to them. A loop gives the item of the
// round. If it loops over a list whose items are known, such as the sets of
// a workout, it gives their fields too.
function holderOffer(card, cards) {
  const names = [...card.outputs];
  const over = /^\s*\{\{\s*([a-z][a-z0-9_]*)\.([A-Za-z_]\w*)\s*\}\}\s*$/.exec(inputsOf(card).items || "");
  const fields = over && cards[over[1]] && (cards[over[1]].item_outputs || {})[over[2]];
  for (const field of fields || []) names.push("item." + field);
  return { ...offerOf(card), names };
}

function grow(box) { box.style.height = "auto"; box.style.height = box.scrollHeight + 2 + "px"; }

// A box for text that can hold values of earlier cards, as {{ card.name }}.
function templateBox(text, offers, onChange) {
  const box = el("textarea");
  box.rows = 1; box.value = text; box.spellcheck = false;
  box.setAttribute("autocapitalize", "off"); box.setAttribute("autocomplete", "off");
  box.oninput = () => { grow(box); onChange(box.value); };
  const wrap = { box, insert: null };
  if (offers.length) {
    wrap.insert = el("button", "link ins", "+ value");
    wrap.insert.type = "button";
    wrap.insert.onclick = () => openValueSheet(box, offers);
  }
  return wrap;
}

function editField(card, field, edit) {
  const inputs = inputsOf(card), e = field.edit;
  const f = el("div", "wc-field"), top = el("div", "wc-ftop");
  const changed = () => { draft.changed = true; };
  top.append(el("label", "", field.label));
  f.append(top);
  if (e.control === "choice") {
    const select = el("select");
    // A stored value that is not a choice any more stays, so that it shows.
    for (const choice of e.choices.includes(inputs[field.name]) ? e.choices : [inputs[field.name], ...e.choices]) {
      select.append(new Option(choice, choice));
    }
    select.value = inputs[field.name];
    select.onchange = () => { inputs[field.name] = select.value; changed(); };
    f.append(select);
  } else if (e.control === "rows") {
    const rows = el("div", "erows");
    const draw = () => {
      rows.replaceChildren();
      inputs[field.name].forEach((row, i) => {
        const line = el("div", "erow"), name = el("input"), remove = el("button", "x", "×");
        name.type = "text"; name.value = row[0]; name.placeholder = "Name"; name.spellcheck = false;
        name.setAttribute("autocapitalize", "off"); name.setAttribute("aria-label", field.label + ", name " + (i + 1));
        name.oninput = () => { row[0] = name.value; changed(); };
        remove.type = "button"; remove.title = "Remove this row"; remove.setAttribute("aria-label", "Remove " + (row[0] || "row"));
        remove.onclick = () => { inputs[field.name].splice(i, 1); changed(); draw(); };
        const value = templateBox(row[1], edit.offers, (text) => { row[1] = text; changed(); });
        value.box.placeholder = "Value"; value.box.setAttribute("aria-label", field.label + ", value of " + (row[0] || "row " + (i + 1)));
        line.append(name, remove, value.box);
        if (value.insert) line.append(value.insert);
        rows.append(line);
        requestAnimationFrame(() => grow(value.box));
      });
    };
    draw();
    const add = el("button", "small", "Add a row");
    add.type = "button";
    add.onclick = () => { inputs[field.name].push(["", ""]); changed(); draw(); rows.lastChild.querySelector("input").focus(); };
    f.append(rows, add);
  } else {
    const value = templateBox(inputs[field.name], edit.offers, (text) => { inputs[field.name] = text; changed(); });
    value.box.setAttribute("aria-label", field.label);
    if (value.insert) top.append(value.insert);
    f.append(value.box);
    requestAnimationFrame(() => grow(value.box));
  }
  if (e.hint) f.append(el("div", "hint", e.hint));
  return f;
}

// The list of values that the cards before a card give. Picking one puts
// it into the box, where the cursor was.
function openValueSheet(box, offers) {
  const at = [box.selectionStart ?? box.value.length, box.selectionEnd ?? box.value.length];
  const back = el("div", "sheet-back"), sheet = el("div", "sheet");
  sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "Insert a value");
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); box.focus(); } };
  const pick = (reference) => {
    const before = box.value.slice(0, at[0]), after = box.value.slice(at[1]);
    // Inside {{ … }} already, the name alone is what is needed.
    const inside = before.lastIndexOf("{{") > before.lastIndexOf("}}");
    const text = inside ? reference : "{{ " + reference + " }}";
    box.value = before + text + after;
    close();
    box.focus();
    box.setSelectionRange(before.length + text.length, before.length + text.length);
    box.dispatchEvent(new Event("input"));
  };
  sheet.append(el("h3", "", "Insert a value"));
  for (const offer of offers) {
    if (!offer.names.length) continue;
    const group = el("div", "grp k-" + offer.kind), head = el("div", "grp-h"), picks = el("div", "picks");
    head.append(el("span", "num", offer.badge), offer.title);
    for (const name of offer.names) {
      const b = el("button", "pill plain", name);
      b.type = "button";
      b.onclick = () => pick(offer.id + "." + name);
      picks.append(b);
    }
    group.append(head, picks);
    sheet.append(group);
  }
  sheet.append(el("div", "foot", "The value goes where the cursor was. Text and values can be mixed."));
  back.append(sheet);
  back.onclick = (e) => { if (e.target === back) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.append(back);
  sheet.querySelector("button.pill")?.focus();
}

// The draft as the server takes it: without the cards it is drawn from.
function draftForm() {
  const bare = (steps) => steps.map((step) => ({ id: step.id, block: step.block, inputs: step.inputs,
                                                 steps: bare(step.steps), otherwise: bare(step.otherwise) }));
  return { name: draft.name, command_name: draft.command_name,
           trigger: { block: draft.trigger.block, params: draft.trigger.params }, steps: bare(draft.steps) };
}

// Try the draft out: run it once, for real, and show what each step got and gave.
function testDraft() {
  const d = draft.shown, offer = d.test;
  openSheet("Test this workflow", (sheet, close) => {
    const run = async (event) => {
      close();
      draft.testing = true; draft.tested = null; draft.problems = [];
      redrawEditor();
      const res = await post("workflows/" + encodeURIComponent(d.id) + "/test", { workflow: draftForm(), event });
      if (!draft || draft.id !== d.id) return;
      draft.testing = false;
      const answer = await res.json().catch(() => ({}));
      if (res.ok) draft.tested = answer.run;
      else draft.problems = answer.problems || [answer.error || "Could not run the test."];
      redrawEditor();
      $("workflow-main").scrollTo(0, 0);
    };
    if (offer.asks) {
      sheet.append(el("div", "", "A workflow that asks you something is not tested here: a test is not a conversation. " +
                                 "Save it and use Run now."));
      return;
    }
    sheet.append(el("div", "foot", "A test runs the steps as they are here, saved or not, once and for real: " +
                                   "what they write is written, and what they send is sent."));
    if (offer.last) {
      sheet.append(option("With the event of the last run", when(offer.last.at) + (offer.last.summary ? " · " + offer.last.summary : ""),
                          "", () => run("last")));
    }
    if (offer.now) sheet.append(option("With an event made now", "As if the trigger fired this moment.", "", () => run("now")));
    if (!offer.last && !offer.now) {
      sheet.append(el("div", "", "There is nothing to test with yet. This workflow has not run, and its trigger " +
                                 "asks before it starts. Save it and use Run now once."));
    }
  });
}

async function saveDraft() {
  const d = draft.shown;
  const res = await api("workflows/" + encodeURIComponent(d.id), { method: "PUT", headers: HEADERS, body: JSON.stringify(draftForm()) });
  if (!draft || draft.id !== d.id) return;
  if (!res.ok) {
    const answer = await res.json().catch(() => ({}));
    draft.problems = answer.problems || [answer.error || "Could not save the workflow."];
    renderWorkflow(d);
    $("workflow-main").scrollTo(0, 0);
    return;
  }
  draft = null;
  renderWorkflow(await res.json());
  const list = await api("workflows");
  if (list.ok && view === "workflows") renderWorkflowNav((await list.json()).workflows);
}

function renderEditor(d) {
  const head = el("div", "wf-head"), name = el("input", "wf-name-edit");
  name.type = "text"; name.value = draft.name; name.setAttribute("aria-label", "Name of the workflow");
  name.oninput = () => { draft.name = name.value; draft.changed = true; };
  head.append(name);
  const parts = [head];
  if (d.by_hand) {
    const sub = el("div", "wf-sub"), label = el("label"), command = el("input");
    command.type = "text"; command.value = draft.command_name; command.placeholder = d.name;
    command.oninput = () => { draft.command_name = command.value; draft.changed = true; };
    label.append("Its command is called ", command);
    sub.append(label, el("span", "", "Empty: the name of the workflow."));
    parts.push(sub);
  }
  if (draft.problems.length) {
    const box = el("div", "wf-problems"), ul = el("ul");
    box.setAttribute("role", "alert");
    for (const problem of draft.problems) ul.append(el("li", "", problem));
    box.append("Not saved. This has to change first:", ul);
    parts.push(box);
  }
  if (draft.tested) {
    // What the test did, step by step, as History shows a run.
    const box = el("div", "wf-test"), top = el("div", "t-top"), hide = el("button", "link", "Hide");
    hide.onclick = () => { draft.tested = null; redrawEditor(); };
    top.append(el("span", "dot " + runDot(draft.tested)), el("strong", "", "Test"), el("span", "", draft.tested.outcome), hide);
    box.append(top, renderTrace(draft.tested, draftCards()));
    parts.push(box);
  }
  const row = el("div", "save-row"), save = el("button", "primary", "Save"), cancel = el("button", "small", "Cancel");
  const test = el("button", "small", draft.testing ? "Testing…" : "Test");
  save.onclick = async () => { save.disabled = true; try { await saveDraft(); } finally { save.disabled = false; } };
  test.onclick = testDraft;
  save.disabled = test.disabled = Boolean(draft.testing);
  cancel.onclick = () => { if (mayLeaveEditor()) renderWorkflow(d); };
  const remove = el("button", "link danger", "Delete this workflow");
  remove.onclick = () => deleteWorkflow(d);
  row.append(save, test, cancel, remove);
  parts.push(renderDraftLane(), row);
  $("workflow-main").replaceChildren(...parts);
}

async function deleteWorkflow(d) {
  if (!confirm("Delete “" + d.name + "” and the history of its runs? This cannot be undone.")) return;
  const res = await api("workflows/" + encodeURIComponent(d.id), { method: "DELETE", headers: HEADERS });
  if (!res.ok) { $("workflow-main").prepend(el("p", "sys err", "Could not delete the workflow.")); return; }
  draft = null;
  currentWorkflow = null;
  loadWorkflows();
}

function traceLines(row, label, data) {
  if (data === undefined || data === null) return;
  const entries = typeof data === "object" && !Array.isArray(data) ? Object.entries(data) : [["", data]];
  if (!entries.length) return;
  const line = el("div", "kv");
  line.append(label + " ");
  entries.forEach(([key, value], i) => {
    if (i) line.append(" · ");
    let text = plain(value);
    if (text.length > 300) text = text.slice(0, 300) + "…";
    if (key) line.append(key + " ");
    line.append(el("b", "", text));
  });
  row.append(line);
}

// One step of a run. A loop also shows its rounds, each with its own steps.
function traceStep(step, cards, place) {
  const card = cards[step.id];
  const row = el("div", "tstep k-" + (card ? card.kind : "action")), h = el("div", "t-head");
  const how = step.status === "ok" ? step.duration_ms + " ms"
    : step.status === "stopped" ? "stopped here" : "failed";
  h.append(el("strong", "", step.title), el("small", "", how));
  // A step that the workflow no longer has is numbered by its place.
  row.append(el("span", "num", card ? card.number : place), h);
  traceLines(row, "got", step.inputs);
  if (step.rounds) row.append(traceRounds(step, cards));
  if (step.conversation) row.append(traceTalk(step.conversation));
  traceLines(row, "gave", step.outputs);
  if (step.inside) row.append(traceSide(step, cards));
  if (step.reason) row.append(el("div", "kv", step.reason));
  if (step.error) row.append(el("div", "kv err", step.error));
  return row;
}

// What a step asked and said, and what the user answered, in order.
function traceTalk(lines) {
  const box = el("div", "talk");
  for (const line of lines) {
    if (line.asked !== undefined) {
      const asked = el("div", "talk-q", line.asked), answer = el("div", "talk-a", line.answer);
      box.append(asked, answer);
    } else if (line.said !== undefined) {
      box.append(el("div", "talk-q", line.said));
    } else if (line.sent !== undefined) {
      box.append(el("div", "talk-q", "Sent the file " + line.sent));
    }
  }
  return box;
}

// The side of a branch that ran, with its steps.
function traceSide(step, cards) {
  const box = el("div", "rounds"), side = el("div", "round side"), inner = el("div", "trace");
  const head = el("div", "side-h", step.took_title + (step.inside.length ? "" : ": no steps"));
  side.append(head);
  if (step.inside.length) {
    step.inside.forEach((s, i) => inner.append(traceStep(s, cards, String(i + 1))));
    side.append(inner);
  }
  box.append(side);
  return box;
}

function traceRounds(step, cards) {
  const box = el("div", "rounds");
  for (const round of step.rounds) {
    const item = el("details", "round"), sum = el("summary");
    const how = round.status === "failed" ? "failed" : round.status === "stopped" ? "stopped early" : "";
    sum.append(el("span", "dot" + (round.status === "failed" ? " bad" : "")),
               el("span", "", (step.round_name || "Round") + " " + round.number + " of " + step.round_count),
               el("small", "", how));
    const inner = el("div", "trace");
    round.steps.forEach((s, i) => inner.append(traceStep(s, cards, String(i + 1))));
    item.append(sum, inner);
