    // What went wrong is what the reader came for.
    item.open = round.status === "failed";
    box.append(item);
  }
  // A long loop keeps its first rounds. A loop that failed did not get to the rest.
  const ran = step.rounds_run ?? step.round_count;
  const notKept = ran - step.rounds.length, notRun = step.round_count - ran;
  if (notKept > 0) box.append(el("div", "kv", "…and " + notKept + " more that ran, which are not kept."));
  if (notRun > 0) box.append(el("div", "kv", "The other " + notRun + " did not run."));
  if (!step.round_count) box.append(el("div", "kv", "There was nothing to repeat for."));
  return box;
}

function renderTrace(run, d) {
  const trace = el("div", "trace");
  const first = el("div", "tstep k-trigger"), head = el("div", "t-head");
  head.append(el("strong", "", d.trigger.title), el("small", "", d.trigger.app));
  first.append(el("span", "num", "T"), head);
  traceLines(first, "gave", run.trigger.outputs);
  trace.append(first);
  const cards = Object.fromEntries(allSteps(d.steps).map((step) => [step.id, step]));
  run.steps.forEach((step, i) => trace.append(traceStep(step, cards, String(i + 1))));
  return trace;
}

async function renderHistory(d, body) {
  body.replaceChildren(el("p", "sys", "Loading…"));
  const res = await api("workflows/" + encodeURIComponent(d.id) + "/runs");
  if (currentWorkflow !== d.id || workflowTab !== "history") return;
  if (!res.ok) { body.replaceChildren(el("p", "sys err", "Could not load the runs.")); return; }
  const runs = (await res.json()).runs;
  if (!runs.length) { body.replaceChildren(el("p", "sys", "This workflow has not run yet.")); return; }
  const list = el("div", "runs");
  for (const run of runs) {
    const item = el("details", "run"), sum = el("summary");
    const how = (run.test ? "Test" : run.called_by ? "Run by “" + run.called_by + "”" : run.manual ? "By hand" : "By itself") +
                (run.attempt > 1 ? ", try " + run.attempt : "");
    sum.append(el("span", "dot " + runDot(run)), el("span", "run-when", when(run.started_at)),
               el("span", "run-how", how), el("span", "run-out", run.outcome));
    item.append(sum, renderTrace(run, d));
    list.append(item);
  }
  body.replaceChildren(list);
}

function renderWorkflow(d) {
  if (draft && draft.id === d.id) { renderEditor(d); return; }
  const main = $("workflow-main");
  const head = el("div", "wf-head");
  const sw = el("label", "switch"), box = el("input");
  box.type = "checkbox"; box.checked = d.enabled; box.setAttribute("role", "switch");
  box.onchange = () => changeWorkflow(d.id, "enabled", { enabled: box.checked });
  sw.append(box, el("span", "", d.enabled ? "On" : "Off"));
  head.append(el("h2", "", d.name), sw);
  if (d.by_hand) {
    const run = el("button", "small", "Run now");
    run.onclick = () => runWorkflow(d);
    head.append(run);
  }
  const edit = el("button", "small", "Edit");
  edit.onclick = () => startEditing(d);
  head.append(edit);

  const status = workflowStatus(d), sub = el("div", "wf-sub"), line = el("span");
  line.append(el("span", "dot " + status.dot), status.text);
  sub.append(line);
  if (d.command && d.enabled) {
    const command = el("span");
    const toggle = el("button", "link", d.command.hidden ? "Show it" : "Hide it");
    toggle.onclick = () => changeWorkflow(d.id, "command", { hidden: !d.command.hidden });
    command.append(d.command.hidden ? "Not in the command menu." : "In the command menu as “" + d.command.text + "”.", toggle);
    sub.append(command);
  } else if (d.command) {
    // A workflow that is off has no command. It can still be run from here.
    sub.append(el("span", "", "It does not run by itself and has no command."));
  }
  if (d.remembers.count) {
    const memory = el("span"), show = el("button", "link", "Show");
    show.onclick = () => openMemory(d);
    memory.append("Remembers " + d.remembers.count + (d.remembers.count === 1 ? " thing." : " things."), show);
    sub.append(memory);
  }

  const parts = [head, sub];
  if (d.problems.length) {
    const box = el("div", "wf-problems"), ul = el("ul");
    for (const problem of d.problems) ul.append(el("li", "", problem));
    box.append("This workflow cannot run.", ul);
    parts.push(box);
  }

  if (d.warnings.length) {
    const box = el("div", "wf-notes"), ul = el("ul");
    for (const warning of d.warnings) ul.append(el("li", "", warning));
    box.append("Two workflows that write the same thing both run, and the one that runs last wins.", ul);
    parts.push(box);
  }

  const tabs = el("div", "tabs"), body = el("div");
  tabs.setAttribute("role", "tablist");
  const show = (tab) => {
    workflowTab = tab;
    for (const t of tabs.children) t.setAttribute("aria-selected", String(t.dataset.tab === tab));
    if (tab === "history") renderHistory(d, body);
    else body.replaceChildren(renderLane(d));
  };
  for (const [tab, label] of [["steps", "Steps"], ["history", "History"]]) {
    const t = el("button", "tab", label);
    t.dataset.tab = tab; t.setAttribute("role", "tab");
    t.onclick = () => show(tab);
    tabs.append(t);
  }
  parts.push(tabs, body);
  main.replaceChildren(...parts);
  show(workflowTab);
}

// What a workflow remembers between runs: the names, and a way to forget them.
function openMemory(d) {
  openSheet("What “" + d.name + "” remembers", (sheet, close) => {
    sheet.append(el("div", "foot", "Steps keep these from one run to the next: that a question was asked, " +
                                   "what was skipped. A workflow that forgets one asks, or does, that again."));
    const list = el("div", "mem");
    for (const name of d.remembers.names) {
      const row = el("div", "mem-row"), forget = el("button", "link", "Forget");
      forget.onclick = () => { close(); changeWorkflow(d.id, "forget", { name }); };
      row.append(el("code", "", name), forget);
      list.append(row);
    }
    sheet.append(list);
    if (d.remembers.count > d.remembers.names.length) {
      sheet.append(el("div", "foot", "…and " + (d.remembers.count - d.remembers.names.length) + " more."));
    }
    const all = el("button", "small danger", "Forget all " + d.remembers.count);
    all.onclick = () => {
      if (!confirm("Make “" + d.name + "” forget everything it remembers?")) return;
      close();
      changeWorkflow(d.id, "forget", {});
    };
    sheet.append(all);
  });
}

async function changeWorkflow(id, what, body) {
  const res = await post("workflows/" + encodeURIComponent(id) + "/" + what, body);
  if (!res.ok) {
    const error = (await res.json().catch(() => ({}))).error;
    $("workflow-main").prepend(el("p", "sys err", error || "Could not change the workflow."));
  }
  // Read it again either way, so the page shows what is stored.
  if (currentWorkflow === id) openWorkflow(id);
}

async function runWorkflow(d) {
  if ((activeFlowId || openPrompt) &&
      !confirm(`Stop what's running and start "${d.name}"?`)) return;
  const res = await post("workflows/" + encodeURIComponent(d.id) + "/run");
  // What the run asks and says is a conversation, so go to where it shows.
  showView("commands");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    addSys(body.error || "Could not start the workflow.", true);
  }
}

// --- Views: the conversation, the workflows and the settings. One shows at a time. ---

let view = "commands";
const VIEWS = { commands: "commands-view", workflows: "workflows", settings: "settings" };
const DRAWER_LABELS = { commands: "Commands", workflows: "Workflows", settings: "Settings sections" };

function showView(name) {
  if (name !== "workflows" && !mayLeaveEditor()) return;
  view = name;
  for (const [key, id] of Object.entries(VIEWS)) $(id).hidden = key !== name;
  // Each button opens its view, and leads back to the conversation from it.
  $("workflows-toggle").textContent = name === "workflows" ? "Commands" : "Workflows";
  $("settings-toggle").textContent = name === "settings" ? "Commands" : "Settings";
  $("drawer-toggle").setAttribute("aria-label", DRAWER_LABELS[name]);
  if (name === "commands") scrollDown();
  else if (name === "workflows") loadWorkflows();
  else loadSettings();
}

// --- The drawer: on a phone, the list on the left slides in over the messages. ---

function setDrawer(open) {
  document.body.classList.toggle("drawer-open", open);
  $("drawer-toggle").setAttribute("aria-expanded", String(open));
}
const drawerIsOpen = () => document.body.classList.contains("drawer-open");

$("drawer-toggle").onclick = () => setDrawer(!drawerIsOpen());
$("scrim").onclick = () => setDrawer(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });

// Swipe right to pull the drawer out, left to push it back. The swipe may
// start anywhere, because Android keeps the screen edge for its own "back"
// gesture. Only a mostly horizontal swipe counts, so scrolling is unaffected.
let swipe = null;
document.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  const typing = e.target.closest("input, textarea, select");
  swipe = e.touches.length === 1 && !typing ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!swipe || !window.matchMedia("(max-width: 720px)").matches) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) / 2) return;
  setDrawer(dx > 0);
}, { passive: true });

$("settings-toggle").onclick = () => { setDrawer(false); showView(view === "settings" ? "commands" : "settings"); };
$("workflows-toggle").onclick = () => { setDrawer(false); showView(view === "workflows" ? "commands" : "workflows"); };
$("filter").oninput = renderCommands;
loadState().then(poll, () => { $("conn").hidden = false; setTimeout(() => location.reload(), 5000); });
</script>
