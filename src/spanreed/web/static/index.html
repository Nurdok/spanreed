<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanreed</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --fg: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #3b5bdb; --accent-fg: #fff; --bubble: #ffffff; --mine: #dbe4ff; --notice: #fff4e6;
    --err: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1e; --fg: #ecebe7; --muted: #9a9993; --line: #2f2f2d;
      --accent: #7b93f0; --accent-fg: #10121a; --bubble: #262624; --mine: #2b3561; --notice: #3a2e1d;
      --err: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .who { color: var(--muted); font-size: 14px; }
  .link { background: none; border: 0; color: var(--accent); padding: 4px; }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; background: var(--card); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 4px 8px; }
  #filter { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--bg); color: var(--fg); font: inherit; margin-bottom: 8px; }
  .cmd { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px;
         background: none; color: var(--fg); }
  .cmd:hover, .cmd:focus-visible { background: var(--bg); outline: none; }
  .cmd small { display: block; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--muted); margin: auto; text-align: center; max-width: 360px; }
  .bubble { max-width: min(640px, 92%); padding: 8px 12px; border-radius: 12px; background: var(--bubble);
            border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
  .bubble.mine { background: var(--mine); border-color: transparent; align-self: flex-end; }
  .bubble.notice { background: var(--notice); border-color: transparent; }
  .bubble pre { white-space: pre-wrap; margin: 4px 0; }
  .bubble a { color: var(--accent); }
  .spoiler { background: var(--muted); color: transparent; border-radius: 3px; }
  .spoiler:hover { color: inherit; background: none; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; }
  .sys.err { color: var(--err); }
  #dock { border-top: 1px solid var(--line); background: var(--card); padding: 12px 16px; }
  #dock:empty { display: none; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .status:last-child { margin-bottom: 0; }
  .status span { flex: 1; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1 1 140px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
                background: var(--bg); color: var(--fg); }
  .row button:hover { border-color: var(--accent); }
  form.input { display: flex; gap: 8px; }
  form.input textarea { flex: 1; resize: vertical; min-height: 42px; max-height: 40vh; padding: 9px 10px;
                        border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .primary { padding: 9px 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); }
  .conn { color: var(--err); font-size: 13px; }
  #google form { display: inline; }
  @media (max-width: 720px) { #google .email { display: none; } }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Spanreed</h1>
    <span id="conn" class="conn" hidden>Reconnecting…</span>
    <span id="who" class="who"></span>
    <span id="google" class="who"></span>
    <button id="logout" class="link">Log out</button>
  </header>
  <div class="layout">
    <aside>
      <h2>Commands</h2>
      <input id="filter" type="search" placeholder="Filter commands" autocomplete="off">
      <nav id="commands"></nav>
    </aside>
    <main>
      <div id="log" aria-live="polite"></div>
      <div id="dock"></div>
    </main>
  </div>
</div>
<script>
"use strict";
const HEADERS = { "X-Spanreed-Request": "1", "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);
let seq = 0, openPrompt = null, activeFlowId = null, commands = [];
const bubbles = new Map();

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function api(path, options = {}) {
  const res = await fetch("/app/api/" + path, { credentials: "same-origin", ...options });
  if (res.status === 401) { location.reload(); throw new Error("logged out"); }
  return res;
}
const post = (path, body) => api(path, { method: "POST", headers: HEADERS, body: JSON.stringify(body || {}) });

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

function addBubble(html, cls, id) {
  $("log").querySelector(".empty")?.remove();
  const b = el("div", "bubble" + (cls ? " " + cls : ""));
  b.innerHTML = html;  // server-sanitized
  if (id) bubbles.set(id, b);
  $("log").append(b);
  return b;
}
function addSys(text, isError) {
  $("log").querySelector(".empty")?.remove();
  $("log").append(el("div", "sys" + (isError ? " err" : ""), text));
}

function apply(ev) {
  switch (ev.type) {
    case "message": addBubble(ev.html, "", ev.id); break;
    case "notification": addBubble("🔔 " + ev.html, "notice"); break;
    case "edit": { const b = bubbles.get(ev.id); if (b) b.innerHTML = ev.html; break; }
    case "delete": { const b = bubbles.get(ev.id); if (b) { b.remove(); bubbles.delete(ev.id); } break; }
    case "document": {
      const b = addBubble("", "", ev.id);
      const a = el("a", "", "📎 " + ev.name);
      a.href = "/app/api/documents/" + encodeURIComponent(ev.id);
      b.append(a);
      break;
    }
    case "prompt": addBubble(ev.html); openPrompt = ev; break;
    case "close-prompt": if (openPrompt && openPrompt.interaction_id === ev.interaction_id) openPrompt = null; break;
    case "answer": addBubble("", "mine").textContent = ev.text; break;
    case "flow-started": activeFlowId = ev.flow_id; addSys("▶ " + ev.title); break;
    case "flow-finished":
      if (ev.flow_id === activeFlowId) activeFlowId = null;
      if (ev.error && ev.error !== "Cancelled.") addSys(ev.error, true);
      else addSys(ev.error ? "Cancelled" : "Done");
      break;
  }
}

function renderDock() {
  const dock = $("dock");
  dock.replaceChildren();
  if (openPrompt) {
    const p = openPrompt;
    if (p.kind === "choice" && p.rows) {
      const rows = el("div", "rows");
      for (const row of p.rows) {
        const r = el("div", "row");
        for (const btn of row) {
          const button = el("button", "", btn.label);
          button.onclick = () => answer(p.interaction_id, btn.value);
          r.append(button);
        }
        rows.append(r);
      }
      dock.append(rows);
    } else {
      const form = el("form", "input");
      const ta = el("textarea");
      ta.rows = 1; ta.placeholder = "Type your answer…"; ta.required = true;
      ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
      form.append(ta, el("button", "primary", "Send"));
      form.onsubmit = (e) => { e.preventDefault(); if (ta.value.trim()) answer(p.interaction_id, ta.value); };
      dock.append(form);
      setTimeout(() => ta.focus(), 0);
    }
  }
  if (openPrompt || activeFlowId) {
    const status = el("div", "status");
    status.append(el("span", "", openPrompt ? "Waiting for your answer" : "Running…"));
    const cancel = el("button", "link", "Cancel");
    cancel.onclick = () => post("cancel", openPrompt ? { interaction_id: openPrompt.interaction_id } : {});
    status.append(cancel);
    if (openPrompt) dock.prepend(status); else dock.append(status);
  }
}

async function answer(interactionId, value) {
  const res = await post("answer", { interaction_id: interactionId, value });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    addSys(body.error || "Could not send your answer.", true);
    if (openPrompt && openPrompt.interaction_id === interactionId) { openPrompt = null; renderDock(); }
  }
}

function renderCommands() {
  const nav = $("commands"), q = $("filter").value.trim().toLowerCase();
  nav.replaceChildren();
  for (const c of commands) {
    if (q && !c.text.toLowerCase().includes(q) && !c.plugin.includes(q)) continue;
    const b = el("button", "cmd", c.text);
    b.append(el("small", "", c.plugin));
    b.onclick = () => run(c);
    nav.append(b);
  }
  if (!nav.children.length) nav.append(el("p", "sys", commands.length ? "No match" : "No commands"));
}

async function run(c) {
  if ((activeFlowId || openPrompt) &&
      !confirm(`Stop what's running and start "${c.text}"?`)) return;
  const res = await post("commands/" + encodeURIComponent(c.id) + "/run");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    addSys(body.error || "Could not start the command.", true);
    loadState();
  }
}

function renderGoogle(google) {
  const box = $("google");
  box.replaceChildren();
  if (!google || !google.available) return;
  if (google.email) {
    const email = el("span", "email", "Google: " + google.email + " ");
    const unlink = el("button", "link", "Unlink Google");
    unlink.onclick = async () => {
      if (!confirm("Unlink " + google.email + "? You'll need a login link to log in on new devices.")) return;
      await post("google/unlink");
      loadState();
    };
    box.append(email, unlink);
  } else {
    // A real form POST: the server answers with a redirect to Google.
    const form = el("form");
    form.method = "post"; form.action = "/app/google/link";
    form.append(el("button", "link", "Link Google account"));
    box.append(form);
  }
}

async function loadState() {
  const res = await api("state");
  const s = await res.json();
  $("who").textContent = s.user.name;
  renderGoogle(s.google);
  commands = s.commands; renderCommands();
  $("log").replaceChildren(); bubbles.clear();
  openPrompt = null;
  if (!s.events.length) {
    $("log").append(el("p", "empty",
      "Pick a command on the left. Its questions and messages show up here, " +
      "without going through Telegram."));
  }
  for (const ev of s.events) apply(ev);
  openPrompt = s.open_prompt; activeFlowId = s.active_flow_id; seq = s.seq;
  renderDock(); scrollDown();
}

async function poll() {
  for (;;) {
    try {
      const res = await api("events?after=" + seq);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      $("conn").hidden = true;
      if (data.reset) { await loadState(); continue; }
      for (const ev of data.events) apply(ev);
      seq = data.seq;
      if (data.events.length) { renderDock(); scrollDown(); }
    } catch (e) {
      $("conn").hidden = false;
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
}

$("filter").oninput = renderCommands;
$("logout").onclick = async () => { await post("logout"); location.reload(); };
loadState().then(poll, () => { $("conn").hidden = false; setTimeout(() => location.reload(), 5000); });
</script>
</body>
</html>
